# Repo-owned checks for pull requests (and for main). They need no secrets and only read the repo.
#
# Third-party actions are pinned to a full commit SHA, with the release in the comment. To move one: look up
# the SHA of the new tag (gh api repos/<owner>/<repo>/git/ref/tags/<tag>) and change both.
#
# Never switch this to `pull_request_target`: that runs with write access and secrets against code from the PR.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same PR (or branch) makes the run in progress pointless
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke checks on the build
        run: npm run test:smoke

      # Information only: a vulnerable dependency should be seen, not block an unrelated PR.
      - name: Audit production dependencies (informational)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the commits in the PR through the API
    steps:
      - name: Check out the whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Scans the commits in the PR (the new commits on a push), not just the tip. Free for a personal
      # account; a repo moved into an organization needs a GITLEAKS_LICENSE secret (see the action's README).
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false' # the token above is read-only; the failed check is the signal
